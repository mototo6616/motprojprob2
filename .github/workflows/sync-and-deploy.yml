name: Sync catalog and deploy

on:
  schedule:
    # Проверяем Google Таблицу каждые 5 минут.
    # Запуск начинается не с круглой минуты, чтобы снизить вероятность задержек GitHub.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

  workflow_dispatch: {}

  # Деплой при изменении кода.
  # Автокоммит синхронизации data/products.json не должен запускать workflow второй раз.
  push:
    branches: [main]
    paths-ignore:
      - 'data/products.json'
      - '.github/last-keepalive'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установить зависимости
        run: npm ci

      - name: Синхронизировать каталог с Google Таблицей
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
        run: npm run sync

      - name: Закоммитить изменения (если есть)
        run: |
          git config user.name "catalog-sync-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/products.json

          # Keepalive: GitHub может отключить расписание после длительного
          # отсутствия активности. Раз в ~45 дней обновляем служебный файл.
          LAST_COMMIT_DAYS_AGO=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))

          if [ "$LAST_COMMIT_DAYS_AGO" -ge 45 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive
            git add .github/last-keepalive
            echo "Прошло $LAST_COMMIT_DAYS_AGO дней с последнего коммита — делаю keepalive-коммит."
          fi

          if git diff --staged --quiet; then
            echo "Изменений для коммита нет."
          else
            git commit -m "chore: sync catalog from sheet [auto]"
            git push
          fi

  deploy:
    needs: sync
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
