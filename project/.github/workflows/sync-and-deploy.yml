name: Sync catalog and deploy

on:
  schedule:
    # Каждые 4 часа. Синтаксис — обычный cron (минута час день месяц день-недели).
    - cron: '0 */4 * * *'
  workflow_dispatch: {}   # позволяет запустить вручную кнопкой во вкладке Actions
  push:
    branches: [main]      # деплой сразу же при любом пуше в main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установить зависимости
        run: npm ci

      - name: Синхронизировать каталог с Google Таблицей
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
        run: npm run sync

      - name: Закоммитить изменения (если есть)
        run: |
          git config user.name "catalog-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/products.json
          git diff --staged --quiet || git commit -m "chore: sync catalog from sheet [auto]"
          git push

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
