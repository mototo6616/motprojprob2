<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Товар — Мототовары</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="header">
  <div class="container header__inner">
    <a href="index.html" class="logo">МОТОТОВАРЫ<span class="logo__dot">.</span></a>

    <nav class="nav" id="nav">
      <a href="index.html#catalog">Каталог</a>
      <a href="index.html#advantages">Преимущества</a>
      <a href="index.html#how">Как купить</a>
      <a href="index.html#contacts">Контакты</a>
    </nav>

    <div class="header__actions">
      <a href="tel:+79000000000" class="phone">
        <svg class="phone__icon" viewBox="0 0 24 24" fill="none"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.9 3 3.4 3.4 3 4 3h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.2 1L6.6 10.8z" stroke="currentColor" stroke-width="1.6"/></svg>
        <span>+7 (900) 000-00-00</span>
      </a>
      <button class="burger" id="burger" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="product-section">
    <div class="container" id="product-root">
      <p class="grid__empty">Загружаем товар…</p>
    </div>
  </section>
</main>

<!-- ===== FOOTER ===== -->
<footer class="footer">
  <div class="container footer__inner">
    <span>МОТОТОВАРЫ — электротранспорт, питбайки, квадроциклы</span>
    <span>© 2026. Все права защищены.</span>
  </div>
</footer>

<!-- ===== ORDER MODAL ===== -->
<div class="modal" id="modal" aria-hidden="true">
  <div class="modal__overlay" data-close></div>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal__close" data-close aria-label="Закрыть">×</button>
    <p class="modal__eyebrow">Заказ</p>
    <h3 class="modal__title" id="modal-title">Модель</h3>
    <p class="modal__text">Свяжитесь любым удобным способом — уточним наличие и оформим заказ.</p>
    <div class="modal__actions">
      <a href="tel:+79000000000" class="btn btn--accent" id="modal-call">Позвонить</a>
      <a href="#" target="_blank" rel="noopener" class="btn btn--whatsapp" id="modal-wa">WhatsApp</a>
      <a href="#" target="_blank" rel="noopener" class="btn btn--telegram" id="modal-tg">Telegram</a>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/product.js"></script>
</body>
</html>
